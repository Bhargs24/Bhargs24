<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Bhargav Raghavendra. I take a vague problem and come back with the shipped thing.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A14"/>
      <stop offset="55%" stop-color="#12102A"/>
      <stop offset="100%" stop-color="#1B1140"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#6346E6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6346E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8F7BFF"/>
      <stop offset="60%" stop-color="#6346E6"/>
      <stop offset="100%" stop-color="#F0B847"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6346E6"/>
      <stop offset="100%" stop-color="#6346E6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .nm   { font: 700 54px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#F7F5FF; letter-spacing:1.5px; }
      .tag  { font: 400 21px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#C3BAE8; }
      .meta { font: 600 13px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#8F84C4; letter-spacing:2.6px; }
      .cap  { font: 400 12px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#7C71B4; letter-spacing:.4px; }
      .axis { stroke:#3B3468; stroke-width:1; stroke-dasharray:3 6; }

      .draw { stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw 9s ease-in-out infinite; }
      @keyframes draw {
        0%   { stroke-dashoffset:1400; }
        30%  { stroke-dashoffset:0; }
        88%  { stroke-dashoffset:0; opacity:1; }
        97%  { stroke-dashoffset:0; opacity:0; }
        100% { stroke-dashoffset:1400; opacity:0; }
      }
      .dot { opacity:0; animation:pop 9s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes pop {
        0%,8%   { opacity:0; r:3; }
        16%     { opacity:1; }
        88%     { opacity:1; }
        97%,100%{ opacity:0; }
      }
      .d2 { animation-delay:.55s; } .d3 { animation-delay:1.05s; } .d4 { animation-delay:1.5s; }
      .halo { animation:halo 2.6s ease-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes halo { 0%{ opacity:.55; transform:scale(.6);} 70%,100%{ opacity:0; transform:scale(2.6);} }
      .h2 { animation-delay:.5s; } .h3 { animation-delay:1s; } .h4 { animation-delay:1.5s; }

      .rise { opacity:0; animation:rise .9s ease-out forwards; }
      @keyframes rise { from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
      .r2 { animation-delay:.18s; } .r3 { animation-delay:.34s; } .r4 { animation-delay:.5s; }
      .grow { transform:scaleX(0); transform-origin:left center; animation:grow 1.1s .3s cubic-bezier(.2,.8,.3,1) forwards; }
      @keyframes grow { to { transform:scaleX(1); } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <g class="rise">
    <text class="meta" x="60" y="86">FOUNDER · ENGINEER · 0 TO 1</text>
  </g>
  <rect class="grow" x="60" y="100" width="150" height="2" fill="url(#rule)"/>

  <g class="rise r2"><text class="nm" x="58" y="164">Bhargav Raghavendra</text></g>
  <g class="rise r3"><text class="tag" x="60" y="206">I take a vague problem and come back</text></g>
  <g class="rise r3"><text class="tag" x="60" y="234">with the shipped thing.</text></g>
  <g class="rise r4"><text class="cap" x="60" y="276">Two published patents · a company shipped solo · I build the whole product</text></g>

  <g opacity="0.9">
    <line class="axis" x1="575" y1="104" x2="1150" y2="104"/>
    <line class="axis" x1="575" y1="252" x2="1150" y2="252"/>

    <path class="draw" fill="none" stroke="url(#curve)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
      d="M 575,105 C 620,172 660,202 705,210 L 716,110 C 762,162 812,184 858,192 L 869,102 C 925,141 975,159 1020,167 L 1031,96 C 1080,117 1118,125 1145,129"/>

    <circle class="halo"    cx="575"  cy="105" r="5" fill="#8F7BFF"/>
    <circle class="halo h2" cx="716"  cy="110" r="5" fill="#8F7BFF"/>
    <circle class="halo h3" cx="869"  cy="102" r="5" fill="#7E68F0"/>
    <circle class="halo h4" cx="1031" cy="96"  r="5" fill="#F0B847"/>

    <circle class="dot"    cx="575"  cy="105" r="4" fill="#F7F5FF"/>
    <circle class="dot d2" cx="716"  cy="110" r="4" fill="#F7F5FF"/>
    <circle class="dot d3" cx="869"  cy="102" r="4" fill="#F7F5FF"/>
    <circle class="dot d4" cx="1031" cy="96"  r="4" fill="#FFE7B4"/>

    <text class="cap" x="575" y="288">memory decays, recall puts it back</text>
    <text class="cap" x="1150" y="288" text-anchor="end">the idea behind Wivme</text>
  </g>
</svg>

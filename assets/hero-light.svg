<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Bhargav Raghavendra. I take a vague problem and come back with the shipped thing.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFAFF"/>
      <stop offset="55%" stop-color="#F4F0FF"/>
      <stop offset="100%" stop-color="#E9E1FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#6346E6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6346E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7E68F0"/>
      <stop offset="60%" stop-color="#6346E6"/>
      <stop offset="100%" stop-color="#C98A0E"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6346E6"/>
      <stop offset="100%" stop-color="#6346E6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .nm   { font: 700 54px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#0E0B1F; letter-spacing:1.5px; }
      .tag  { font: 400 21px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#3F3866; }
      .meta { font: 600 13px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#6346E6; letter-spacing:2.6px; }
      .cap  { font: 400 12px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#6A6580; letter-spacing:.4px; }
      .axis { stroke:#CFC6EE; stroke-width:1; stroke-dasharray:3 6; }

      /* GitHub's README renderer applies static CSS but does NOT run animations.
         So every element is fully composed at rest. Motion is additive only:
         nothing here depends on an animation having run in order to be visible. */
      .draw { stroke-dasharray:1400; animation:draw 9s ease-in-out infinite; }
      @keyframes draw {
        0%      { stroke-dashoffset:1400; }
        26%,80% { stroke-dashoffset:0; }
        100%    { stroke-dashoffset:-1400; }
      }
      .dot  { animation:pop 9s ease-in-out infinite; }
      @keyframes pop { 0%,6%{ opacity:0; } 14%,84%{ opacity:1; } 96%,100%{ opacity:0; } }
      .d2 { animation-delay:.55s; } .d3 { animation-delay:1.05s; } .d4 { animation-delay:1.5s; }

      .halo { opacity:.22; animation:halo 2.6s ease-out infinite;
              transform-box:fill-box; transform-origin:center; }
      @keyframes halo { 0%{ opacity:.55; transform:scale(.6);} 70%,100%{ opacity:0; transform:scale(2.6);} }
      .h2 { animation-delay:.5s; } .h3 { animation-delay:1s; } .h4 { animation-delay:1.5s; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <g>
    <text class="meta" x="60" y="86">FOUNDER · ENGINEER · 0 TO 1</text>
  </g>
  <rect x="60" y="100" width="150" height="2" fill="url(#rule)"/>

  <g><text class="nm" x="58" y="164">Bhargav Raghavendra</text></g>
  <g><text class="tag" x="60" y="206">I take a vague problem and come back</text></g>
  <g><text class="tag" x="60" y="234">with the shipped thing.</text></g>
  <g><text class="cap" x="60" y="276">Two published patents · a company shipped solo · I build the whole product</text></g>

  <g opacity="0.9">
    <line class="axis" x1="575" y1="104" x2="1150" y2="104"/>
    <line class="axis" x1="575" y1="252" x2="1150" y2="252"/>

    <path class="draw" fill="none" stroke="url(#curve)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
      d="M 575,105 C 620,172 660,202 705,210 L 716,110 C 762,162 812,184 858,192 L 869,102 C 925,141 975,159 1020,167 L 1031,96 C 1080,117 1118,125 1145,129"/>

    <circle class="halo"    cx="575"  cy="105" r="5" fill="#7E68F0"/>
    <circle class="halo h2" cx="716"  cy="110" r="5" fill="#7E68F0"/>
    <circle class="halo h3" cx="869"  cy="102" r="5" fill="#7E68F0"/>
    <circle class="halo h4" cx="1031" cy="96"  r="5" fill="#C98A0E"/>

    <circle class="dot"    cx="575"  cy="105" r="4" fill="#3B2E86"/>
    <circle class="dot d2" cx="716"  cy="110" r="4" fill="#3B2E86"/>
    <circle class="dot d3" cx="869"  cy="102" r="4" fill="#3B2E86"/>
    <circle class="dot d4" cx="1031" cy="96"  r="4" fill="#B8830E"/>

    <text class="cap" x="575" y="288">memory decays, recall puts it back</text>
    <text class="cap" x="1150" y="288" text-anchor="end">the idea behind Wivme</text>
  </g>
</svg>

name: Project cards

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/gen_cards.py", ".github/workflows/panels.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python tools/gen_cards.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panels
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "regenerate project cards"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race, retry $i"; sleep 5
          done
          exit 1

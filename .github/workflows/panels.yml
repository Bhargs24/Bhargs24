name: Language panel

on:
  schedule:
    - cron: "15 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/gen_panels.py", ".github/workflows/panels.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python tools/gen_panels.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panels
          git commit -m "regenerate language panel" || echo "no changes"
          git push

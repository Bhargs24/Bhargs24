name: Metrics panels

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  panels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Languages and coding habits, rendered as one panel.
      # Generated files are committed into metrics/ so nothing is served by a
      # third-party host at read time, which is what breaks most profile widgets.
      - name: Languages and habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/code.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Bhargs24
          base: ""
          config_timezone: Asia/Kolkata
          config_order: languages, habits
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: >-
            html, css, cmake, makefile, batchfile, objective-c, objective-c++,
            shaderlab, hlsl, glsl, powershell, dockerfile
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # Achievements and recent activity.
      - name: Achievements and activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Bhargs24
          base: ""
          config_timezone: Asia/Kolkata
          config_order: achievements, activity
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, push, review
